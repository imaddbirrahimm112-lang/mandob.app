<head>

    <style>
        /* ==========================================
           1. Core Variables & Solid Matte Reset
           ========================================== */
        :root {
            --bg-base: #09090b;       /* Pure Matte Black */
            --bg-surface: #141417;    /* Dark Solid Grey for Cards */
            --bg-input: #000000;      /* Deep Black for inputs */
            --border-color: #232328;  /* Subtle solid border */
            --accent: #D26043;        /* Burnt Coral */
            --accent-hover: #b85239;
            --text-main: #ffffff;     /* Bright White for Readability */
            --text-muted: #9ca3af;    /* Soft Grey for labels */
            --success: #10b981;
            --danger: #ef4444;
            --gold: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: background-color 0.2s, border-color 0.2s, color 0.2s; }
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Extremely Clear Numbers */
        .ltr-num { 
            direction: ltr; 
            display: inline-block; 
            font-variant-numeric: tabular-nums; 
            white-space: nowrap; 
            letter-spacing: 0.8px; 
            font-weight: 900; 
            font-size: 1.1em;
        }

        .text-primary { color: var(--accent) !important; } 
        .text-success { color: var(--success) !important; } 
        .text-danger { color: var(--danger) !important; } 
        .text-gold { color: var(--gold) !important; }

        .hidden { display: none !important; } 
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        h1, h2, h3 { font-weight: 900; margin-bottom: 1rem; color: var(--text-main); }
        h2 { font-size: 1.6rem; border-right: 4px solid var(--accent); padding-right: 12px; }

        /* ==========================================
           2. Solid Panels & Cards (No More Blur)
           ========================================== */
        .panel, .card, .metric-card, .detail-box, .office-card, .dashboard-office-card, .modal {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .card:hover, .office-card:hover, .dashboard-office-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(210, 96, 67, 0.15);
        }

        /* ==========================================
           3. Layout
           ========================================== */
        .sidebar { 
            width: 260px; 
            background-color: #0e0e11; 
            border-left: 1px solid var(--border-color); 
            display: flex; flex-direction: column; padding: 2rem 1rem; height: 100%; z-index: 100; overflow-y: auto; 
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--accent); text-align: center; margin-bottom: 2.5rem; letter-spacing: 1px; }
        
        .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 1rem; text-align: right; font-size: 1rem; font-weight: 800; cursor: pointer; border-radius: 8px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        .nav-btn:hover { background-color: var(--bg-surface); color: var(--text-main); }
        .nav-btn.active { background-color: rgba(210, 96, 67, 0.1); border-right: 4px solid var(--accent); color: var(--accent); }
        
        .main { flex: 1; overflow-y: auto; padding: 2rem; scroll-behavior: smooth; }

        /* ==========================================
           4. Dashboards & Typography
           ========================================== */
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
        .card { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .card-title { font-size: 0.95rem; color: var(--text-muted); font-weight: 700; }
        .card-value { font-size: 2.2rem; font-weight: 900; color: var(--text-main); line-height: 1.2; }

        .dashboard-cards { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        .metric-card { padding: 1.2rem; min-height: 120px; }
        .metric-card .card-title { font-size: 0.85rem; margin-bottom: 0.5rem; }
        .metric-card .card-value { font-size: 1.6rem; }
        .card-hint { font-size: 0.8rem; color: #6b7280; font-weight: 700; margin-top: auto; }

        .dashboard-office-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
        .dashboard-office-card { padding: 1rem; cursor: pointer; }
        .dashboard-office-card h3 { font-size: 1rem; margin-bottom: 0.8rem; border: none; padding: 0; }
        .dashboard-office-card .card-title { font-size: 0.8rem; color: var(--text-muted); }
        .dashboard-office-card .card-value { font-size: 1.2rem; }

        .summary-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .summary-pill { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; font-weight: 800; border-right: 4px solid var(--accent); }
        .summary-pill small { display:block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.25rem; }
        .summary-pill strong { font-size: 1.2rem; color: var(--text-main); }

        /* ==========================================
           5. Forms & Inputs (High Visibility)
           ========================================== */
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .tab-btn { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.8rem 2rem; font-size: 1rem; font-weight: 800; cursor: pointer; border-radius: 8px; }
        .tab-btn:hover { background-color: #1a1a20; }
        .tab-btn.active { background-color: var(--accent); color: white; border-color: var(--accent); }

        .form-section { padding: 2rem; margin-bottom: 2.5rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group.full { grid-column: 1 / -1; }
        
        label { font-size: 0.95rem; color: var(--text-muted); font-weight: 700; }
        
        /* Ultra clear inputs */
        input, select { 
            background-color: var(--bg-input); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 1rem 1.2rem; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            outline: none; 
        }
        input:focus, select:focus { border-color: var(--accent); background-color: #050505; }
        
        .btn-submit { background-color: var(--accent); color: white; border: none; padding: 1.2rem; border-radius: 8px; font-weight: 900; font-size: 1.2rem; cursor: pointer; width: 100%; margin-top: 1rem; text-transform: uppercase; }
        .btn-submit:hover { background-color: var(--accent-hover); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .section-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-mini { padding: 0.8rem 1.2rem; border-radius: 8px; font-size: 0.95rem; width: auto; margin: 0; }
        .btn-soft { background-color: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 800; }
        .btn-soft:hover { border-color: var(--accent); color: var(--accent); }

        /* ==========================================
           6. Clean Tables
           ========================================== */
        .table-wrap { overflow-x: auto; border-radius: 12px; margin-top: 1rem; max-height: 550px; overflow-y: auto; background-color: var(--bg-surface); border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 1.2rem; border-bottom: 1px solid var(--border-color); font-size: 1rem; }
        th { background-color: #0e0e11; color: var(--text-muted); font-weight: 900; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid var(--border-color); }
        tr:hover td { background-color: #1a1a20; }
        
        .btn-action { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 800; margin-left: 0.5rem; }
        .btn-action:hover { border-color: var(--accent); color: var(--accent); }
        .btn-action.del { color: var(--danger); }
        .btn-action.del:hover { background-color: var(--danger); color: white; border-color: var(--danger); }

        .badge { display: inline-flex; align-items: center; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 900; background-color: #1f1f25; border: 1px solid var(--border-color); }
        .badge.green { color: var(--success); border-color: rgba(16,185,129,0.3); }
        .badge.gold { color: var(--gold); border-color: rgba(251,191,36,0.3); }
        .badge.red { color: var(--danger); border-color: rgba(239,68,68,0.3); }

        .clickable-name { color: var(--accent); cursor: pointer; font-weight: 900; text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 4px; }
        .clickable-name:hover { color: var(--text-main); }

        /* Filters */
        .filter-pack { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
        .search-input { width: 300px; padding: 0.8rem; font-size: 0.95rem; }
        .filter-pack input[type="date"] { width: 150px; padding: 0.8rem; font-size: 0.9rem; }
        .filter-chip { background-color: #0e0e11; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; padding: 0.8rem 1rem; font-weight: 800; cursor: pointer; }
        .filter-chip:hover { border-color: var(--accent); color: var(--accent); }

        /* ==========================================
           7. Modals & Toasts
           ========================================== */
        .modal-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background-color: var(--bg-base); border: 1px solid var(--accent); border-radius: 12px; width: 90%; max-width: 800px; padding: 2rem; max-height: 90vh; overflow-y: auto; }
        .modal-header-line { border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .detail-box { border: 1px solid var(--border-color); background-color: var(--bg-surface); border-radius: 8px; padding: 1rem; }
        .detail-box small { display:block; color: var(--text-muted); font-weight: 800; margin-bottom: 0.5rem; }
        .detail-box strong { font-size: 1.2rem; color: var(--text-main); }

        #toasts { position: fixed; top: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-right: 4px solid var(--success); padding: 1.2rem 2rem; border-radius: 8px; font-weight: 900; color: white; animation: slideIn 0.3s forwards; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .toast.error { border-right-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* Mobile Fixes */
        .records-table { display: block; width: 100%; table-layout: auto; border-collapse: separate; border-spacing: 0; background: transparent; }
        .records-table thead { display: none; }
        .records-table tbody { display: grid; gap: 1rem; width: 100%; }
        .records-table tr { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; width: 100%; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--bg-surface); }
        .records-table td { display: flex; flex-direction: column; gap: 0.4rem; padding: 0; border: 0; font-size: 1rem; }
        .records-table td::before { content: attr(data-label); color: var(--text-muted); font-size: 0.85rem; font-weight: 900; text-transform: uppercase; }
        .note-cell, .actions-cell { grid-column: 1 / -1; }
        .note-cell { background-color: var(--bg-base); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); }
        .actions-cell { flex-direction: row !important; justify-content: flex-end; margin-top: 0.5rem; }


        /* ==========================================
           8. Premium Visual Upgrade - No logic changes
           ========================================== */
        :root {
            --bg-base: #050507;
            --bg-surface: rgba(18, 18, 23, 0.92);
            --bg-input: rgba(1, 1, 3, 0.92);
            --border-color: rgba(255, 255, 255, 0.075);
            --accent: #d76547;
            --accent-hover: #ef7d5b;
            --accent-soft: rgba(215, 101, 71, 0.13);
            --accent-line: rgba(239, 125, 91, 0.55);
            --champagne: #f2c777;
            --platinum: #c7cbd3;
            --success: #18c792;
            --danger: #ff5d63;
            --gold: #f2c777;
            --text-main: #f7f4ef;
            --text-muted: #a9b2c2;
            --shadow-premium: 0 22px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            --ring-premium: 0 0 0 1px rgba(215,101,71,0.17), 0 0 32px rgba(215,101,71,0.08);
        }

        * { transition: background-color .22s ease, border-color .22s ease, color .22s ease, transform .22s ease, box-shadow .22s ease, opacity .22s ease; }

        body {
            background:
                radial-gradient(circle at 12% 14%, rgba(215,101,71,0.17) 0, transparent 27%),
                radial-gradient(circle at 84% 9%, rgba(242,199,119,0.08) 0, transparent 24%),
                radial-gradient(circle at 52% 100%, rgba(255,255,255,0.035) 0, transparent 31%),
                linear-gradient(135deg, #030304 0%, #08080b 45%, #050506 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at 50% 25%, black 0%, transparent 74%);
            opacity: .34;
        }

        .sidebar, .main, #toasts, .modal-overlay { position: relative; z-index: 1; }

        .sidebar {
            background:
                linear-gradient(180deg, rgba(17,17,22,0.98), rgba(8,8,11,0.98)),
                radial-gradient(circle at top, rgba(215,101,71,0.16), transparent 42%);
            border-left: 1px solid rgba(255,255,255,0.09);
            box-shadow: -18px 0 50px rgba(0,0,0,0.42), inset 1px 0 0 rgba(255,255,255,0.035);
        }

        .logo {
            color: transparent;
            background: linear-gradient(135deg, #ff8a64, #f2c777 48%, #d76547 100%);
            -webkit-background-clip: text;
            background-clip: text;
            letter-spacing: 1.6px;
            text-shadow: 0 16px 35px rgba(215,101,71,0.18);
            position: relative;
        }

        .logo::after {
            content: '';
            display: block;
            width: 58px;
            height: 2px;
            margin: .8rem auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--champagne), transparent);
        }

        .nav-btn {
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 1rem 1.05rem;
            margin-bottom: .62rem;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.045);
            border-color: rgba(255,255,255,0.08);
            transform: translateX(-3px);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, rgba(215,101,71,0.22), rgba(242,199,119,0.055));
            border: 1px solid rgba(215,101,71,0.34);
            border-right: 4px solid var(--accent);
            box-shadow: 0 10px 28px rgba(215,101,71,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
            color: #ff8a64;
        }

        .main {
            padding: 2.35rem;
        }

        h2 {
            font-size: clamp(1.55rem, 2.4vw, 2.25rem);
            letter-spacing: -.5px;
            border-right: 5px solid var(--accent);
            padding-right: 14px;
            text-shadow: 0 18px 38px rgba(0,0,0,0.42);
        }

        .panel, .card, .metric-card, .detail-box, .office-card, .dashboard-office-card, .modal, .summary-pill, .table-wrap {
            background:
                linear-gradient(145deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015) 42%, rgba(215,101,71,0.035)),
                var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.078);
            border-radius: 18px;
            box-shadow: var(--shadow-premium);
        }

        .panel::before, .card::before, .metric-card::before, .detail-box::before, .office-card::before, .dashboard-office-card::before, .summary-pill::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.32), transparent);
            opacity: .65;
            pointer-events: none;
        }

        .panel:hover, .card:hover, .office-card:hover, .dashboard-office-card:hover, .metric-card:hover, .summary-pill:hover {
            border-color: rgba(215,101,71,0.42);
            box-shadow: var(--shadow-premium), var(--ring-premium);
            transform: translateY(-2px);
        }

        .card, .metric-card { padding: 1.45rem; }
        .card-title, label, .records-table td::before { color: var(--text-muted); }
        .card-value { letter-spacing: -.4px; }

        .summary-strip {
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1rem;
        }

        .summary-pill {
            min-height: 104px;
            padding: 1.1rem 1.2rem;
            border-right: 0;
            overflow: hidden;
        }

        .summary-pill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 16px;
            bottom: 16px;
            width: 4px;
            border-radius: 999px 0 0 999px;
            background: linear-gradient(180deg, var(--accent), var(--champagne));
            box-shadow: 0 0 22px rgba(215,101,71,.36);
        }

        .summary-pill small {
            color: #b7bfcc;
            font-size: .88rem;
        }

        .summary-pill strong {
            font-size: clamp(1.22rem, 1.8vw, 1.75rem);
            line-height: 1.25;
            letter-spacing: -.45px;
        }

        .form-section {
            padding: 2.2rem;
            border-radius: 22px;
            background:
                linear-gradient(145deg, rgba(255,255,255,0.052), rgba(255,255,255,0.016)),
                radial-gradient(circle at 15% 0%, rgba(215,101,71,0.10), transparent 38%),
                rgba(14,14,18,.94);
        }

        .form-grid { gap: 1.35rem; }

        input, select {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012)),
                rgba(0,0,0,0.74);
            border: 1px solid rgba(255,255,255,0.095);
            border-radius: 14px;
            color: var(--text-main);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 10px 24px rgba(0,0,0,0.24);
            min-height: 58px;
        }

        input:hover, select:hover { border-color: rgba(255,255,255,0.16); }

        input:focus, select:focus {
            border-color: rgba(215,101,71,0.72);
            background-color: rgba(0,0,0,0.86);
            box-shadow: 0 0 0 4px rgba(215,101,71,0.10), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .btn-submit, .tab-btn.active {
            background: linear-gradient(135deg, #d76547, #ef7d5b 54%, #b94f35);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 14px 34px rgba(215,101,71,0.28), inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .btn-submit {
            min-height: 64px;
            border-radius: 16px;
            letter-spacing: .2px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(110%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
            transition: transform .55s ease;
        }

        .btn-submit:hover::before { transform: translateX(-110%); }
        .btn-submit:hover { transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(1px) scale(.997); }

        .tab-btn, .btn-soft, .filter-chip, .btn-action {
            border-radius: 13px;
            background: rgba(255,255,255,0.035);
            border-color: rgba(255,255,255,0.08);
        }

        .tab-btn:hover, .btn-soft:hover, .filter-chip:hover, .btn-action:hover {
            background: rgba(215,101,71,0.105);
            box-shadow: 0 10px 24px rgba(0,0,0,0.24);
        }

        #ho-delegate-info:not(.hidden) {
            animation: premiumFadeUp .25s ease both;
        }

        #ho-delegate-info .detail-box {
            min-height: 108px;
            border-color: rgba(242,199,119,0.12);
            background:
                linear-gradient(145deg, rgba(242,199,119,0.055), rgba(255,255,255,0.018)),
                rgba(13,13,17,0.96);
        }

        #ho-delegate-info .detail-box small {
            font-size: .9rem;
            color: #bdc5d2;
        }

        #ho-delegate-info .detail-box strong {
            font-size: clamp(1.28rem, 2vw, 1.85rem);
            line-height: 1.2;
        }

        .table-wrap {
            border-radius: 20px;
            background: rgba(12,12,16,0.88);

            --danger: #d94049;

        body.theme-light {
            background:
                radial-gradient(circle at 12% 12%, rgba(215,101,71,.16) 0, transparent 29%),
                radial-gradient(circle at 88% 18%, rgba(184,122,41,.12) 0, transparent 27%),
                linear-gradient(135deg, #fff8ef 0%, #f4eadf 48%, #eadccb 100%);

        body::after {
            content: '';
            position: fixed;
            inset: -22%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 22%, var(--mesh-a) 0, transparent 26%),
                radial-gradient(circle at 78% 18%, var(--mesh-b) 0, transparent 24%),
                radial-gradient(circle at 48% 86%, var(--mesh-c) 0, transparent 31%),

        @keyframes premiumMeshBreath {
            0% { transform: translate3d(0,0,0) scale(1) rotate(0deg); }
            50% { transform: translate3d(2.5%, -1.5%, 0) scale(1.04) rotate(2deg); }
            100% { transform: translate3d(-2%, 1.5%, 0) scale(1.02) rotate(-2deg); }

    };

    const signedClass = (value, usd=false) => value < 0 ? 'text-danger' : (value > 0 ? (usd ? 'text-gold' : 'text-success') : '');
    const officeEffect = (t, name) => {
        let syp = 0, usd = 0;
        if (t.type === 'HANDOVER' && t.toType === 'office' && t.toId === name) { syp += Number(t.syp)||0; usd += (Number(t.usd)||0) + handoverCutUsd(t); }
        if (t.type === 'office_transfer') { if(t.fromId===name){ t.cur==='SYP'?syp-=t.amt:usd-=t.amt; syp-=officeCommissionSyp(t); usd-=officeCommissionUsd(t); } if(t.toId===name) t.cur==='SYP'?syp+=t.amt:usd+=t.amt; }
        if (t.type === 'office_convert_syp_to_usd' && t.fromId === name) { syp -= Number(t.amt)||0; usd += convertSypToUsd(t.amt, t.rate); }
        if (['office_external','office_person','office_adjust_sub'].includes(t.type) && t.fromId === name) { t.cur==='SYP'?syp-=t.amt:usd-=t.amt; if(['office_external','office_person'].includes(t.type)){ syp-=officeCommissionSyp(t); usd-=officeCommissionUsd(t); } }
        if (t.type === 'office_adjust_add' && t.fromId === name) t.cur==='SYP'?syp+=t.amt:usd+=t.amt;
        if (t.type === 'SAFE_TO_OFFICE' && t.toId === name) t.cur==='SYP'?syp+=t.amt:usd+=t.amt;
        if (t.type === 'OFFICE_TO_SAFE' && t.fromId === name) { t.cur==='SYP'?syp-=t.amt:usd-=t.amt; syp-=officeCommissionSyp(t); usd-=officeCommissionUsd(t); }
        return {syp, usd};
    };
    const safeEffect = (t, name) => {
        let syp = 0, usd = 0;
        if (t.type === 'HANDOVER' && t.toType === 'safe' && t.toId === name) { syp += Number(t.syp)||0; usd += (Number(t.usd)||0) + handoverCutUsd(t); }
        if (t.safeId === name || t.fromId === name || t.toId === name) {
            switch(t.type) {
                case 'SAFE_IN_SYP': case 'SAFE_RECEIVE_PERSON_SYP': case 'ADVANCE_RETURN_SYP': if(t.safeId===name) syp+=t.amt; break;
                case 'SAFE_IN_GENERAL': if(t.safeId===name) t.cur==='USD'?usd+=t.amt:syp+=t.amt; break;
                case 'SAFE_IN_USD': case 'SAFE_RECEIVE_PERSON_USD': case 'ADVANCE_RETURN_USD': if(t.safeId===name) usd+=t.amt; break;
                case 'SAFE_OUT_PERSON_SYP': case 'SAFE_EXPENSE_SYP': case 'ADVANCE_GIVEN_SYP': if(t.safeId===name) syp-=t.amt; break;
                case 'SAFE_OUT_GENERAL': if(t.safeId===name) t.cur==='USD'?usd-=t.amt:syp-=t.amt; break;
                case 'SAFE_OUT_PERSON_USD': case 'SAFE_EXPENSE_USD': case 'ADVANCE_GIVEN_USD': if(t.safeId===name) usd-=t.amt; break;
                case 'SAFE_EXCHANGE_SYP_TO_USD': if(t.safeId===name){ syp-=Number(t.amt)||0; usd+=convertSypToUsd(t.amt,t.rate); } break;
                case 'SAFE_EXCHANGE_USD_TO_SYP': if(t.safeId===name){ usd-=Number(t.amt)||0; syp+=(Number(t.amt)||0)*(Number(t.rate)||0); } break;
                case 'SAFE_TO_SAFE': if(t.fromId===name) t.cur==='SYP'?syp-=t.amt:usd-=t.amt; if(t.toId===name) t.cur==='SYP'?syp+=t.amt:usd+=t.amt; break;
                case 'SAFE_TO_OFFICE': if(t.fromId===name || (!t.fromId && t.safeId===name)) t.cur==='SYP'?syp-=t.amt:usd-=t.amt; break;
                case 'OFFICE_TO_SAFE': if(t.toId===name || (!t.toId && t.safeId===name)) t.cur==='SYP'?syp+=t.amt:usd+=t.amt; break;
            }
        }
        return {syp, usd};
    };
    const signedEntityTxTable = (items, kind, name, empty='لا يوجد حركات', tableId=`entity-detail-${Date.now()}`) => {
        const effectFor = kind === 'office' ? officeEffect : safeEffect;
        const rows = items.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(t => {

    const metricSparkline = (values=[]) => {
        const nums = (values.length ? values : [0,0,0,0,0,0,0]).map(v => Number(v) || 0);
        const max = Math.max(...nums.map(Math.abs), 1);
        const step = 100 / Math.max(nums.length - 1, 1);
        const pts = nums.map((v, i) => `${(i*step).toFixed(2)},${(34 - ((Math.abs(v) / max) * 26)).toFixed(2)}`).join(' ');
        return `<svg class="sparkline" viewBox="0 0 100 38" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,38 ${pts} 100,38"></polygon><polyline points="${pts}"></polyline></svg>`;

    const metricCard = (title, value, cls='', hint='', sparkValues=null) => `<div class="panel metric-card ${cls}"><div class="card-title">${title}</div><div class="card-value ${cls}">${value}</div>${hint ? `<div class="card-hint">${hint}</div>` : ''}${sparkValues ? metricSparkline(sparkValues) : ''}</div>`;
    const dashboardOfficeCard = (name, b) => `<div class="panel dashboard-office-card" onclick="ui.openOffice('${encodeURIComponent(name)}')"><h3>${escapeHtml(name)}</h3><div class="flex-between"><span class="card-title">SYP</span><span class="card-value ${calc.color(b.syp)}">${calc.num(b.syp)}</span></div><div class="flex-between"><span class="card-title">USD</span><span class="card-value text-gold">${calc.num(b.usd,true)}</span></div></div>`;
    const lastSevenDates = () => Array.from({length:7}, (_, i) => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); d.setDate(d.getDate() - (6 - i)); return d.toISOString().slice(0,10); });

    const weightedExchangeRateSeries = () => lastSevenDates().map(day => {
        let syp = 0, usd = 0;
        state.tx.forEach(t => {
            if ((t.date || '').slice(0,10) !== day) return;

            if (t.type === 'SAFE_EXCHANGE_USD_TO_SYP' && Number(t.rate) > 0) { usd += Number(t.amt) || 0; syp += (Number(t.amt) || 0) * Number(t.rate); }

    const breadcrumbTrail = (items=[]) => `<div class="breadcrumb-trail">${items.map((item, i) => `<span>${escapeHtml(item)}</span>${i < items.length - 1 ? '<i>←</i>' : ''}`).join('')}</div>`;

    const pageTopbar = () => {

    const officeNameCell = (name) => name && CONSTANTS.OFFICES.includes(name) ? `<span class="clickable-name" onclick="ui.openOffice('${encodeURIComponent(name)}')">${escapeHtml(name)}</span>` : escapeHtml(name || '-');
    const safeNameCell = (name) => name && CONSTANTS.SAFES.includes(name) ? `<span class="clickable-name" onclick="ui.openSafe('${encodeURIComponent(name)}')">${escapeHtml(name)}</span>` : escapeHtml(name || '-');
    const sourceCell = (t) => t.delegate ? `<span class="clickable-name" onclick="ui.openDelegate('${encodeURIComponent(t.delegate)}')">${escapeHtml(t.delegate)}</span>` : (CONSTANTS.OFFICES.includes(txSource(t)) ? officeNameCell(txSource(t)) : safeNameCell(txSource(t)));
    const destinationCell = (t) => CONSTANTS.OFFICES.includes(txDestination(t)) ? officeNameCell(txDestination(t)) : (CONSTANTS.SAFES.includes(txDestination(t)) ? safeNameCell(txDestination(t)) : escapeHtml(txDestination(t)));
    const toolbar = (title, exportCall='', searchId='') => `<div class="section-head"><h2>${title}</h2><div class="section-actions">${searchId ? tableFilterControls(searchId) : ''}${exportCall ? `<button class="btn-soft btn-mini" onclick="${exportCall}">تصدير Excel 📊</button>` : ''}</div></div>`;

    const localDateText = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
    const localMonthStart = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); d.setDate(1); return d.toISOString().slice(0,10); };
    function applyTableFilters(tableId) {
        const table = document.getElementById(tableId); const scope = document.querySelector(`[data-filter-scope="${tableId}"]`); if(!table || !scope) return;
        const q = (scope.querySelector('[data-filter-q]')?.value || '').trim().toLowerCase();
        const from = scope.querySelector('[data-filter-from]')?.value || ''; const to = scope.querySelector('[data-filter-to]')?.value || '';
        table.querySelectorAll('tbody tr').forEach(row => {
            const text = row.innerText.toLowerCase();
            const dateCell = row.querySelector('td[data-label="التاريخ"]') || Array.from(row.cells || []).find(cell => (cell.getAttribute('data-label') || '').trim() === 'التاريخ');
            const date = (dateCell?.innerText || '').trim().slice(0,10);
            const matchText = !q || text.includes(q);
            const matchFrom = !from || (!!date && date >= from);
            const matchTo = !to || (!!date && date <= to);
            row.style.display = (matchText && matchFrom && matchTo) ? '' : 'none';
        });
    }
    function bindTableFilters(root=document) {
        root.querySelectorAll('[data-filter-scope]').forEach(scope => {
            if(scope.dataset.filterReady === '1') return; scope.dataset.filterReady = '1';
            const tableId = scope.dataset.filterScope;
            scope.querySelectorAll('input').forEach(input => { input.addEventListener('input', () => applyTableFilters(tableId)); input.addEventListener('change', () => applyTableFilters(tableId)); });
            scope.querySelectorAll('[data-filter-quick]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const today = localDateText(); const from = scope.querySelector('[data-filter-from]'); const to = scope.querySelector('[data-filter-to]'); const q = scope.querySelector('[data-filter-q]');
                    const action = btn.dataset.filterQuick;
                    if(action === 'today') { if(from) from.value = today; if(to) to.value = today; }
                    if(action === 'month') { if(from) from.value = localMonthStart(); if(to) to.value = today; }
                    if(action === 'clear') { if(q) q.value = ''; if(from) from.value = ''; if(to) to.value = ''; }
                    applyTableFilters(tableId);
                });
            });
        });
    }
    function enhanceRecordTables(root=document) {
        root.querySelectorAll('table.records-table').forEach(table => {
            const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.innerText.trim());
            table.querySelectorAll('tbody tr').forEach(row => {
                const cells = Array.from(row.children).filter(el => el.tagName === 'TD');
                cells.forEach((td, index) => {
                    const label = headers[index] || td.getAttribute('data-label') || 'تفاصيل';
                    td.setAttribute('data-label', label);
                    if (!td.classList.contains('note-cell') && /ملاحظة/.test(label)) td.classList.add('note-cell');
                    if (!td.classList.contains('actions-cell') && /إجراء/.test(label)) td.classList.add('actions-cell');
                });
                const idMatch = row.innerHTML.match(/ui\.(?:del|edit|res|hardDel)\('([^']+)'\)/);
                if (idMatch) row.dataset.txId = idMatch[1];
            });
        });
    }


    const normalizeTx = (raw={}) => {
        const source = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
        const t = {...source};
        const now = Date.now();

        t.id = cleanId(t.id);
        t.type = cleanText(t.type, 72);
        if (t.type === 'office_to_cashbox') t.type = 'OFFICE_TO_SAFE';
        if (t.type === 'cashbox_to_office') t.type = 'SAFE_TO_OFFICE';
        t.date = cleanDate(t.date);
        timeFields.forEach(field => {
            if (t[field] !== undefined && t[field] !== '') {
                const n = Number(t[field]);
                t[field] = Number.isFinite(n) ? n : now;
            }
        });
        t.createdAt = Number(t.createdAt) || Number(t.updatedAt) || now;
        t.updatedAt = Number(t.updatedAt) || t.createdAt || now;

        moneyFields.forEach(field => { t[field] = parseMoney(t[field]); });
        ['region','delegate','revType','toType','toId','fromId','safeId','person','note'].forEach(field => {
            if (t[field] !== undefined) t[field] = cleanText(t[field], field === 'note' ? 420 : 160);
        });
        t.cur = cleanCurrency(t.cur);

        if (t.type === 'REVENUE') {
            t.syp = Math.max(0, t.syp);
            t.usd = 0; t.amt = 0; t.cutSyp = 0; t.rate = 0;
        }

        if (t.type === 'HANDOVER') {
            t.syp = Math.max(0, t.syp);
            t.usd = Math.max(0, t.usd);
            t.cutSyp = Math.max(0, t.cutSyp);
            t.rate = Math.max(0, t.rate);
            t.toType = t.toType === 'safe' ? 'safe' : 'office';
            t.cur = 'SYP';
            t.amt = 0;
        }

        if (t.type === 'office_convert_syp_to_usd') {
            t.toId = '';
            t.person = '';
            t.cur = 'SYP';
        }

        if (t.type === 'SAFE_TO_OFFICE') {
            if (!t.fromId && t.safeId) t.fromId = t.safeId;
            if (CONSTANTS.OFFICES.includes(t.fromId) && CONSTANTS.SAFES.includes(t.toId)) {
                const officeName = t.fromId;
                t.fromId = t.toId;
                t.toId = officeName;
            }
            t.safeId = '';
            t.person = '';
        }

        if (t.type === 'OFFICE_TO_SAFE') {
            if (!t.toId && t.safeId) t.toId = t.safeId;
            if (CONSTANTS.SAFES.includes(t.fromId) && CONSTANTS.OFFICES.includes(t.toId)) {
                const safeName = t.fromId;
                t.fromId = t.toId;
                t.toId = safeName;
            }
            t.safeId = '';
            t.person = '';
        }

        if (t.type === 'SAFE_TO_SAFE') {
            t.safeId = '';
            t.person = '';
        }

        if (fixedUsdTypes.includes(t.type)) t.cur = 'USD';
        if (fixedSypTypes.includes(t.type)) t.cur = 'SYP';
        if (t.type === 'SAFE_EXCHANGE_SYP_TO_USD') t.cur = 'SYP';
        if (t.type === 'SAFE_EXCHANGE_USD_TO_SYP') t.cur = 'USD';

        t.amt = Math.max(0, t.amt);
        t.rate = Math.max(0, t.rate);
        t.commissionSyp = Math.max(0, t.commissionSyp);
        t.commissionUsd = Math.max(0, t.commissionUsd);
        if (!hasOfficeCommission(t)) {
            t.commissionSyp = 0;
            t.commissionUsd = 0;
        }

        return t;
    };

    const validateTx = (t) => {
        if (!t || !t.type) throw new Error('نوع الحركة غير صالح');
        if (t.type === 'REVENUE') {
            if (!t.delegate) throw new Error('اختر المندوب');
            if ((Number(t.syp) || 0) <= 0) throw new Error('أدخل مبلغ صحيح');
        }
        if (t.type === 'HANDOVER') {
            if (!t.delegate) throw new Error('اختر المندوب');
            if (!t.toId) throw new Error('اختر الوجهة');
            if (t.toType === 'office' && !CONSTANTS.OFFICES.includes(t.toId)) throw new Error('اختر مكتب صحيح');
            if (t.toType === 'safe' && !CONSTANTS.SAFES.includes(t.toId)) throw new Error('اختر صندوق صحيح');
            if (!(Number(t.syp) || 0) && !(Number(t.usd) || 0) && !(Number(t.cutSyp) || 0)) throw new Error('أدخل مبلغ واحد على الأقل');
            if ((Number(t.cutSyp) || 0) > 0 && (Number(t.rate) || 0) <= 0) throw new Error('أدخل سعر صرف صحيح للقص');
        }
        if (Object.keys(CONSTANTS.OFFICE_TYPES).includes(t.type)) {
            if ((Number(t.amt) || 0) <= 0) throw new Error('أدخل مبلغ صحيح');
            if (t.type === 'office_transfer' && t.fromId === t.toId) throw new Error('لا يمكن تحويل مكتب إلى نفس المكتب');
            if (t.type === 'office_convert_syp_to_usd' && (Number(t.rate) || 0) <= 0) throw new Error('أدخل سعر صرف صحيح');
        }
        if (Object.keys(CONSTANTS.SAFE_TYPES).includes(t.type)) {
            if ((Number(t.amt) || 0) <= 0) throw new Error('أدخل مبلغ صحيح');
            if ((t.type === 'SAFE_EXCHANGE_SYP_TO_USD' || t.type === 'SAFE_EXCHANGE_USD_TO_SYP') && (Number(t.rate) || 0) <= 0) throw new Error('أدخل سعر صرف صحيح');
            if (t.type === 'SAFE_TO_SAFE' && t.fromId === t.toId) throw new Error('لا يمكن تحويل صندوق إلى نفس الصندوق');
            if (t.type === 'SAFE_TO_OFFICE' && (!CONSTANTS.SAFES.includes(t.fromId) || !CONSTANTS.OFFICES.includes(t.toId))) throw new Error('اختر صندوق ومكتب صحيحين');
            if (t.type === 'OFFICE_TO_SAFE' && (!CONSTANTS.OFFICES.includes(t.fromId) || !CONSTANTS.SAFES.includes(t.toId))) throw new Error('اختر مكتب وصندوق صحيحين');
        }
        return t;
    };

    const asArray = (value) => Array.isArray(value) ? value.filter(Boolean) : [];
    const asObject = (value) => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    const txTime = (t) => Number(t?.updatedAt || t?.createdAt || 0);
    const delTime = (t) => Number(t?.deletedAt || t?.updatedAt || t?.createdAt || 0);
    const newestRecord = (current, next, timeFn=txTime) => !current || timeFn(next) >= timeFn(current) ? next : current;
    const cleanPurgedTx = (purged={}) => Object.fromEntries(
        Object.entries(asObject(purged))
            .map(([id, ts]) => [id, Number(ts)])
            .filter(([id, ts]) => id && Number.isFinite(ts) && ts > 0)
    );
    const reconcileStore = (local={}, remote={}) => {
        const activeById = new Map();
        const deletedById = new Map();
        const purgedTx = cleanPurgedTx({...asObject(remote.purgedTx), ...asObject(local.purgedTx)});

        [...asArray(remote.tx), ...asArray(local.tx)].forEach(raw => {
            const t = normalizeTx(raw);
            if(!t?.id || purgedTx[t.id]) return;
            activeById.set(t.id, newestRecord(activeById.get(t.id), t, txTime));
        });

        [...asArray(remote.delTx), ...asArray(local.delTx)].forEach(raw => {
            const t = normalizeTx(raw);
            if(!t?.id || purgedTx[t.id]) return;
            deletedById.set(t.id, newestRecord(deletedById.get(t.id), t, delTime));
        });

        deletedById.forEach((deleted, id) => {
            const active = activeById.get(id);
            if(!active || delTime(deleted) >= txTime(active)) activeById.delete(id);
            else deletedById.delete(id);
        });

        return {
            tx: Array.from(activeById.values()).sort((a,b)=>(txTime(b)-txTime(a))),
            delTx: Array.from(deletedById.values()).sort((a,b)=>(delTime(b)-delTime(a))),
            purgedTx
        };
    };
    const persistLocal = () => {
        localStorage.setItem('rc_data', JSON.stringify({tx:state.tx, delTx:state.delTx, purgedTx:state.purgedTx}));
        syncStatus.lastLocalSavedAt = Date.now();
    };

    async function sync(options={}) {
        const { renderAfterRemote=false } = options;
        const localSnapshot = { tx: state.tx, delTx: state.delTx, purgedTx: state.purgedTx };
        let merged = reconcileStore(localSnapshot, {});
        state.tx = merged.tx; state.delTx = merged.delTx; state.purgedTx = merged.purgedTx;
        persistLocal();

        if(!db || !firestoreApi) {
            syncStatus.lastCloudError = 'Firebase غير جاهز أو المكتبات لم تحمل';
            return { ok:false, local:true, cloud:false, error:syncStatus.lastCloudError };
        }
        if(!currentUser) {
            syncStatus.lastCloudError = 'سجلي دخول Firebase لتفعيل المزامنة السحابية';
            return { ok:false, local:true, cloud:false, auth:false, error:syncStatus.lastCloudError };
        }

        syncStatus.busy = true;
        try {
            const ref = firestoreApi.doc(db, ...FIRESTORE_LEDGER_PATH);
            const txResult = await firestoreApi.runTransaction(db, async (transaction) => {
                const snap = await transaction.get(ref);
                const remote = snap.exists() ? snap.data() : { tx:[], delTx:[], purgedTx:{} };
                const mergedStore = reconcileStore({ tx: state.tx, delTx: state.delTx, purgedTx: state.purgedTx }, remote);
                transaction.set(ref, { tx:mergedStore.tx, delTx:mergedStore.delTx, purgedTx:mergedStore.purgedTx, last:Date.now() }, { merge:true });
                return mergedStore;
            });
            state.tx = txResult.tx; state.delTx = txResult.delTx; state.purgedTx = txResult.purgedTx;
            persistLocal();
            syncStatus.lastCloudSavedAt = Date.now();
            syncStatus.lastCloudError = '';
            if (renderAfterRemote && typeof renderView === 'function') renderView();
            return { ok:true, local:true, cloud:true };
        } catch(e) {
            syncStatus.lastCloudError = cleanText(e?.message || 'فشل مزامنة السحابة', 180);
            console.warn('Sync failed:', e);
            return { ok:false, local:true, cloud:false, error:syncStatus.lastCloudError };
        } finally {
            syncStatus.busy = false;
        }
    }

    window.saveData = async () => {
        const merged = reconcileStore({tx:state.tx, delTx:state.delTx, purgedTx:state.purgedTx}, {});
        state.tx=merged.tx; state.delTx=merged.delTx; state.purgedTx=merged.purgedTx;
        persistLocal();
        return await sync({ renderAfterRemote:false });
    };

    window.loadData = async () => {
        try {
            const d = JSON.parse(localStorage.getItem('rc_data')||'{"tx":[],"delTx":[],"purgedTx":{}}');
            const merged = reconcileStore(d, {});
            state.tx = merged.tx; state.delTx = merged.delTx; state.purgedTx = merged.purgedTx;
        } catch(e) { state.tx=[]; state.delTx=[]; state.purgedTx={}; }
        persistLocal();
        return await sync({ renderAfterRemote:false });
    };


    // --- CORE CALCULATIONS ---
    window.calc = {
        num: (n, usd=false) => `<span class="ltr-num">${Number(usd?parseFloat(n||0).toFixed(2):Math.floor(n||0)).toLocaleString('en-US')}</span>`,
        color: (n) => n>0?'text-success':(n<0?'text-danger':''),
        delegate: (name) => { let b=0, rev=0, ho=0, cut=0; state.tx.filter(t=>t.delegate===name).forEach(t=>{ if(t.type==='REVENUE'){ b+=t.syp; rev+=t.syp; } if(t.type==='HANDOVER'){ b-=(t.syp||0)+(t.cutSyp||0); ho+=t.syp||0; cut+=t.cutSyp||0; } }); return {b, rev, ho, cut}; },
        office: (name) => { let syp=0, usd=0; state.tx.forEach(t=>{ if(t.type==='HANDOVER' && t.toType==='office' && t.toId===name){ syp+=t.syp||0; usd+=(Number(t.usd)||0)+handoverCutUsd(t); } if(t.type==='office_transfer'){ if(t.fromId===name){ t.cur==='SYP'?syp-=t.amt:usd-=t.amt; syp-=officeCommissionSyp(t); usd-=officeCommissionUsd(t); } if(t.toId===name) t.cur==='SYP'?syp+=t.amt:usd+=t.amt; } if(t.type==='office_convert_syp_to_usd' && t.fromId===name){ syp-=Number(t.amt)||0; usd+=convertSypToUsd(t.amt, t.rate); } if(['office_external','office_person','office_adjust_sub'].includes(t.type) && t.fromId===name){ t.cur==='SYP'?syp-=t.amt:usd-=t.amt; if(['office_external','office_person'].includes(t.type)){ syp-=officeCommissionSyp(t); usd-=officeCommissionUsd(t); } } if(t.type==='office_adjust_add' && t.fromId===name){ t.cur==='SYP'?syp+=t.amt:usd+=t.amt; } if(t.type==='SAFE_TO_OFFICE' && t.toId===name){ t.cur==='SYP'?syp+=t.amt:usd+=t.amt; } if(t.type==='OFFICE_TO_SAFE' && t.fromId===name){ t.cur==='SYP'?syp-=t.amt:usd-=t.amt; syp-=officeCommissionSyp(t); usd-=officeCommissionUsd(t); } }); return {syp, usd}; },
        safe: (name) => { let syp=0, usd=0; state.tx.forEach(t=>{ if(t.type==='HANDOVER' && t.toType==='safe' && t.toId===name){ syp+=t.syp||0; usd+=(Number(t.usd)||0)+handoverCutUsd(t); } if(t.safeId===name || t.fromId===name || t.toId===name){ switch(t.type){ case 'SAFE_IN_SYP': case 'SAFE_RECEIVE_PERSON_SYP': case 'ADVANCE_RETURN_SYP': if(t.safeId===name) syp+=t.amt; break; case 'SAFE_IN_GENERAL': if(t.safeId===name) t.cur==='USD'?usd+=t.amt:syp+=t.amt; break; case 'SAFE_IN_USD': case 'SAFE_RECEIVE_PERSON_USD': case 'ADVANCE_RETURN_USD': if(t.safeId===name) usd+=t.amt; break; case 'SAFE_OUT_PERSON_SYP': case 'SAFE_EXPENSE_SYP': case 'ADVANCE_GIVEN_SYP': if(t.safeId===name) syp-=t.amt; break; case 'SAFE_OUT_GENERAL': if(t.safeId===name) t.cur==='USD'?usd-=t.amt:syp-=t.amt; break; case 'SAFE_OUT_PERSON_USD': case 'SAFE_EXPENSE_USD': case 'ADVANCE_GIVEN_USD': if(t.safeId===name) usd-=t.amt; break; case 'SAFE_EXCHANGE_SYP_TO_USD': if(t.safeId===name){ syp-=Number(t.amt)||0; usd+=convertSypToUsd(t.amt, t.rate); } break; case 'SAFE_EXCHANGE_USD_TO_SYP': if(t.safeId===name){ usd-=Number(t.amt)||0; syp+=(Number(t.amt)||0)*(Number(t.rate)||0); } break; case 'SAFE_TO_SAFE': if(t.fromId===name) t.cur==='SYP'?syp-=t.amt:usd-=t.amt; if(t.toId===name) t.cur==='SYP'?syp+=t.amt:usd+=t.amt; break; case 'SAFE_TO_OFFICE': if(t.fromId===name || (!t.fromId && t.safeId===name)) t.cur==='SYP'?syp-=t.amt:usd-=t.amt; break; case 'OFFICE_TO_SAFE': if(t.toId===name || (!t.toId && t.safeId===name)) t.cur==='SYP'?syp+=t.amt:usd+=t.amt; break; } } }); return {syp, usd}; }
    };

    // --- 4. UI HELPERS ---
    const stripHtmlText = (html='') => {

        return div.innerText.replace(/\s+/g, ' ').trim();
    };
    const exportRowsToExcel = (filename, headers, rows) => {
        if (!window.XLSX) return ui?.toast ? ui.toast('مكتبة Excel غير جاهزة بعد','error') : alert('Excel library is not ready');
        const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        const wb = XLSX.utils.book_new();
        ws['!cols'] = headers.map((h, i) => ({ wch: Math.max(String(h).length + 4, ...rows.map(r => String(r[i] ?? '').length + 2), 14) }));
        XLSX.utils.book_append_sheet(wb, ws, 'Export');
        XLSX.writeFile(wb, `${filename}_${Date.now()}.xlsx`);
    };
    const exportVisibleTableToExcel = (tableId, filename) => {
        const table = document.getElementById(tableId);

            return Array.from(row.querySelectorAll('td')).filter((td, i) => (headers[i] || td.getAttribute('data-label')) !== 'إجراء').map(td => td.innerText.replace(/\s+/g, ' ').trim());
        }).filter(row => row.length && !row.join('').includes('لا يوجد'));
        if (!rows.length) return ui.toast('لا يوجد بيانات ظاهرة للتصدير','error');

    const optionHtml = (arr=[], selected='') => arr.map(item => `<option value="${escapeHtml(item)}" ${String(item)===String(selected)?'selected':''}>${escapeHtml(item)}</option>`).join('');

    const editSelectField = (name, label, options=[], selected='') => `<div class="form-group"><label>${escapeHtml(label)}</label><select name="${escapeHtml(name)}">${optionHtml(options, selected)}</select></div>`;
    const editNoteField = (value='') => `<div class="form-group full"><label>ملاحظة</label><input type="text" name="note" value="${escapeHtml(value || '')}"></div>`;

            } else if (t.type === 'office_external' || t.type === 'office_person') {
                fields.push(editSelectField('fromId', 'من مكتب', CONSTANTS.OFFICES, t.fromId), editField('person','الجهة/الشخص',t.person), editSelectField('cur','العملة',['SYP','USD'],t.cur), editMoneyField('amt','المبلغ',t.amt), editMoneyField('commissionSyp','عمولة SYP',t.commissionSyp), editMoneyField('commissionUsd','عمولة USD',t.commissionUsd));
            } else {
                fields.push(editSelectField('fromId', 'المكتب', CONSTANTS.OFFICES, t.fromId), editSelectField('cur','العملة',['SYP','USD'],t.cur), editMoneyField('amt','المبلغ',t.amt));
            }
            fields.push(editNoteField(t.note));
        } else if (Object.keys(CONSTANTS.SAFE_TYPES).includes(t.type)) {
            if (t.type === 'SAFE_TO_SAFE') {
                fields.push(editSelectField('fromId', 'من صندوق', CONSTANTS.SAFES, t.fromId), editSelectField('toId', 'إلى صندوق', CONSTANTS.SAFES, t.toId), editSelectField('cur','العملة',['SYP','USD'],t.cur), editMoneyField('amt','المبلغ',t.amt));
            } else if (t.type === 'SAFE_TO_OFFICE') {
                fields.push(editSelectField('fromId', 'من صندوق', CONSTANTS.SAFES, t.fromId), editSelectField('toId', 'إلى مكتب', CONSTANTS.OFFICES, t.toId), editSelectField('cur','العملة',['SYP','USD'],t.cur), editMoneyField('amt','المبلغ',t.amt));
            } else if (t.type === 'OFFICE_TO_SAFE') {
                fields.push(editSelectField('fromId', 'من مكتب', CONSTANTS.OFFICES, t.fromId), editSelectField('toId', 'إلى صندوق', CONSTANTS.SAFES, t.toId), editSelectField('cur','العملة',['SYP','USD'],t.cur), editMoneyField('amt','المبلغ',t.amt), editMoneyField('commissionSyp','عمولة SYP',t.commissionSyp), editMoneyField('commissionUsd','عمولة USD',t.commissionUsd));
            } else {

        }

        return `<form id="frm-edit-tx" data-id="${escapeHtml(t.id)}" class="form-grid">${fields.join('')}<div class="form-group full"><button type="submit" class="btn-submit">حفظ التعديل الحقيقي</button></div></form>`;

        toast: (m, type='success') => { const c=document.getElementById('toasts'), t=document.createElement('div'); if(!c) return; t.className=`toast ${type}`; t.textContent = (type==='success'?'✅ ':'❌ ') + cleanText(m, 260); c.appendChild(t); setTimeout(()=>t.remove(),3000); },
        opts: (arr) => arr.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join(''),

        openModal: (title, html) => { document.getElementById('modal-title').textContent = cleanText(title, 160); document.getElementById('modal-body').innerHTML = html; document.getElementById('edit-modal-overlay').style.display='flex'; setTimeout(() => { const body=document.getElementById('modal-body'); enhanceRecordTables(body); bindTableFilters(body); attachMoneyInputs(); }, 0); },

        del: async (id) => { if(confirm('متأكد من مسح الحركة وإعادة حساب الأرصدة؟')){ const idx = state.tx.findIndex(x=>x.id===id); if(idx>-1){ const now=Date.now(); const deleted=normalizeTx({...state.tx[idx], deletedAt:now, updatedAt:now}); state.tx.splice(idx,1); state.delTx = [...state.delTx.filter(x=>x.id!==id), deleted]; delete state.purgedTx[id]; const result = await saveData(); renderView(); showSaveResult(result, 'تم النقل للمحذوفات والمزامنة'); } } },
        res: async (id) => { const idx = state.delTx.findIndex(x=>x.id===id); if(idx>-1){ const now=Date.now(); const restored=normalizeTx({...state.delTx[idx], restoredAt:now, updatedAt:now}); delete restored.deletedAt; state.delTx.splice(idx,1); state.tx = [...state.tx.filter(x=>x.id!==id), restored]; delete state.purgedTx[id]; const result = await saveData(); renderView(); showSaveResult(result, 'تم الاسترجاع والمزامنة'); } },

                gain.gain.exponentialRampToValueAtTime(.035, ctx.currentTime + .012);

                if (node.dataset.counted === '1') return;
                const original = node.textContent.trim();
                const numeric = Number(original.replace(/,/g, '').replace(/[^0-9.\-]/g, ''));
                if (!Number.isFinite(numeric) || Math.abs(numeric) > 999999999999) return;
                node.dataset.counted = '1';
                const decimals = original.includes('.') ? Math.min((original.split('.')[1] || '').length, 2) : 0;
                const duration = 620;
                const start = performance.now();
                const format = (v) => Number(v.toFixed(decimals)).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
                const step = (now) => {
                    const p = Math.min((now - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - p, 3);

    function viewDashboard() {
        let rev=0, revCcbs=0, revMasary=0, rem=0, oSyp=0, oUsd=0, cSyp=0, cUsd=0;
        state.tx.forEach(t=>{
            if(t.type==='REVENUE') { rev += Number(t.syp) || 0; if(t.revType === 'CCBS') revCcbs += Number(t.syp) || 0; if(t.revType === 'MASARY') revMasary += Number(t.syp) || 0; }
            if(t.type==='HANDOVER' && handoverCutUsd(t)) { cSyp += Number(t.cutSyp) || 0; cUsd += handoverCutUsd(t); }
            if((t.type==='SAFE_EXCHANGE_SYP_TO_USD'||t.type==='office_convert_syp_to_usd') && Number(t.rate)>0) { cSyp += Number(t.amt) || 0; cUsd += (Number(t.amt) || 0) / Number(t.rate); }
            if(t.type==='SAFE_EXCHANGE_USD_TO_SYP' && Number(t.rate)>0) { cUsd += Number(t.amt) || 0; cSyp += (Number(t.amt) || 0) * Number(t.rate); }
        });
        ui.dels().forEach(d=>{ const b=calc.delegate(d).b; if(b>0) rem+=b; });
        CONSTANTS.OFFICES.forEach(o=>{ const b=calc.office(o); oSyp+=b.syp; oUsd+=b.usd; });
        const mainSafe = calc.safe('صندوق أساسي');
        const avgExchangeRate = cUsd > 0 ? cSyp / cUsd : 0;
        const officeBalanceCards = CONSTANTS.OFFICES.map(o => ({name:o, b:calc.office(o)})).filter(x => Math.abs(x.b.syp) > 0.0001 || Math.abs(x.b.usd) > 0.0001).map(x => dashboardOfficeCard(x.name, x.b)).join('');
        
        return `${toolbar('المركز المالي', '', '')}
        <div class="grid-cards dashboard-cards">
            ${metricCard('إجمالي الإيرادات SYP', calc.num(rev), 'text-primary', 'CCBS + MASARY', trendSeries(t=>t.type==='REVENUE', t=>t.syp))}
            ${metricCard('إيراد CCBS', calc.num(revCcbs), 'text-success', 'إيرادات CCBS فقط', trendSeries(t=>t.type==='REVENUE' && t.revType==='CCBS', t=>t.syp))}
            ${metricCard('إيراد MASARY', calc.num(revMasary), 'text-gold', 'إيرادات المصاري فقط', trendSeries(t=>t.type==='REVENUE' && t.revType==='MASARY', t=>t.syp))}
            ${metricCard('متبقي المندوبين SYP', calc.num(rem), 'text-danger', 'ذمم غير مسلمة', trendSeries(t=>t.type==='HANDOVER' || t.type==='REVENUE', t=>t.type==='REVENUE'?t.syp:((t.syp||0)+(t.cutSyp||0))))}
            ${metricCard('أرصدة المكاتب', `${calc.num(oSyp)} <span style="font-size:1rem;color:var(--text-muted)">SYP</span><br><span class="text-gold">${calc.num(oUsd,true)} <span style="font-size:1rem;color:var(--text-muted)">USD</span></span>`, 'text-success', 'كل المكاتب', trendSeries(t=>sectionTransactions('offices').some(x=>x.id===t.id), t=>txSypValue(t)+txUsdValue(t)))}
            ${metricCard('الصندوق الأساسي', `${calc.num(mainSafe.syp)} <span style="font-size:1rem;color:var(--text-muted)">SYP</span><br><span class="text-gold">${calc.num(mainSafe.usd,true)} <span style="font-size:1rem;color:var(--text-muted)">USD</span></span>`, 'text-success', 'الصندوق الأساسي فقط', trendSeries(t=>matchesSafeMovement(t, 'صندوق أساسي'), t=>txSypValue(t)+txUsdValue(t)))}
            ${metricCard('السوري المتداول بالقص', `${calc.num(cSyp)} <span style="font-size:1rem;color:var(--text-muted)">SYP</span>`, 'text-danger', 'كل عمليات القص', trendSeries(t=>(t.type==='HANDOVER' && Number(t.cutSyp)>0) || t.type==='SAFE_EXCHANGE_SYP_TO_USD' || t.type==='SAFE_EXCHANGE_USD_TO_SYP' || t.type==='office_convert_syp_to_usd', t=>t.type==='SAFE_EXCHANGE_USD_TO_SYP' ? (Number(t.amt)||0)*(Number(t.rate)||0) : (t.cutSyp||t.amt)))}
            ${metricCard('الدولار المتداول بالقص', `${calc.num(cUsd,true)} <span style="font-size:1rem;color:var(--text-muted)">USD</span>`, 'text-success', 'كل عمليات القص', trendSeries(t=>(t.type==='HANDOVER' && Number(t.cutSyp)>0) || t.type==='SAFE_EXCHANGE_SYP_TO_USD' || t.type==='SAFE_EXCHANGE_USD_TO_SYP' || t.type==='office_convert_syp_to_usd', t=>t.type==='SAFE_EXCHANGE_USD_TO_SYP' ? t.amt : (handoverCutUsd(t)||convertSypToUsd(t.amt, t.rate))))}
            ${metricCard('سعر الصرف الوسطي', `${calc.num(avgExchangeRate)} <span style="font-size:1rem;color:var(--text-muted)">SYP/USD</span>`, 'text-gold', 'المقصوص ÷ الدولار الناتج', weightedExchangeRateSeries())}
        </div>
        <div class="panel" style="padding:1.5rem; margin-top:2rem">
            <h3 style="color:var(--accent); font-size:1.1rem; margin-bottom:1rem;">المكاتب النشطة</h3>
            <div class="dashboard-office-grid">${officeBalanceCards || '<div class="empty-state">لا يوجد مكاتب فيها رصيد حالياً</div>'}</div>
        </div>`;
    }

    function viewExchange() {
        const cuts = sectionTransactions('exchange').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
        let syp=0, usd=0;
        const trs = cuts.map(t=>{
            const cSyp = txSypValue(t);
            const cUsd = txUsdValue(t);
            syp += cSyp; usd += cUsd;
            return `<tr><td data-label="التاريخ">${escapeHtml(t.date)}</td><td data-label="المصدر">${t.delegate?`<span class="clickable-name" onclick="ui.openDelegate('${encodeURIComponent(t.delegate)}')">${escapeHtml(t.delegate)}</span>`:escapeHtml(t.safeId||t.fromId||'-')}</td><td data-label="الوجهة/النوع">${escapeHtml(txDestination(t) === '-' ? txTypeLabel(t) : txDestination(t))}</td><td data-label="SYP المتداول" class="ltr-num">${calc.num(cSyp)}</td><td data-label="السعر" class="ltr-num text-gold">${calc.num(t.rate)}</td><td data-label="USD المتداول" class="ltr-num text-success">${calc.num(cUsd,true)}</td></tr>`;
        }).join('');
        return `${toolbar('قص الدولار', '', 'exchange-table')}
        <div class="grid-cards dashboard-cards">
            ${metricCard('إجمالي SYP المتداول', calc.num(syp), 'text-danger')}
            ${metricCard('إجمالي USD المتداول', calc.num(usd,true), 'text-success')}
            ${metricCard('المتوسط', calc.num(usd>0?syp/usd:0), 'text-gold')}
        </div>
        <div class="table-wrap"><table id="exchange-table" class="records-table"><thead><tr><th>التاريخ</th><th>المصدر</th><th>الوجهة/النوع</th><th>SYP المتداول</th><th>السعر</th><th>USD المتداول</th></tr></thead><tbody>${trs||'<tr><td colspan="6" class="empty-state">لا يوجد عمليات قص</td></tr>'}</tbody></table></div>`;
    }

    function viewDelegates() {
        const active = ui.dels().map(d=>({name:d, bal:calc.delegate(d), count:state.tx.filter(t=>t.delegate===d).length})).filter(x=>x.bal.rev!==0 || x.bal.ho!==0 || x.bal.cut!==0 || x.bal.b!==0);
        const dels = active.map(({name:d, bal:b, count})=>{ const delivered=(Number(b.ho)||0)+(Number(b.cut)||0); const pct=b.rev>0?Math.min(100, Math.round((delivered/b.rev)*100)):0; return `
            <div class="card office-card" onclick="ui.openDelegate('${encodeURIComponent(d)}')">
                <div class="delegate-card-head"><h3>${escapeHtml(d)}</h3><div class="progress-ring" style="--p:${pct}"><span>${pct}%</span></div></div>
                <div class="card-title">إيراد: <span class="ltr-num text-main">${calc.num(b.rev)}</span></div>
                <div class="card-title">مسلم: <span class="ltr-num text-success">${calc.num(delivered)}</span></div>
                <div style="margin-top:1rem; border-top:1px solid var(--border-color); padding-top:1rem;" class="flex-between"><span style="font-weight:700">المتبقي</span><span class="${calc.color(b.b)} ltr-num" style="font-size:1.5rem; font-weight:900;">${calc.num(b.b)}</span></div>
            </div>`}).join('');
        return `${toolbar('ذمم المندوبين', 'ui.exportDelegates()', '')}<div class="grid-cards">${dels||'<div class="empty-state" style="grid-column:1/-1">لا يوجد حركات للمندوبين</div>'}</div>`;
    }

    function viewAdvances() {
        const adv = sectionTransactions('advances').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
        const trs = adv.map(t=>`<tr><td data-label="التاريخ">${escapeHtml(t.date)}</td><td data-label="الصندوق">${escapeHtml(t.safeId||'-')}</td><td data-label="النوع">${typeBadge(CONSTANTS.SAFE_TYPES[t.type]||t.type)}</td><td data-label="الشخص">${escapeHtml(t.person||'-')}</td><td data-label="المبلغ" class="ltr-num">${calc.num(t.amt, t.type.includes('USD'))}</td><td data-label="ملاحظة" class="note-cell">${escapeHtml(t.note||'-')}</td><td data-label="إجراء" class="actions-cell"><button class="btn-action" onclick="ui.edit('${t.id}')">تعديل</button><button class="btn-action del" onclick="ui.del('${t.id}')">حذف</button></td></tr>`).join('');
        return `${toolbar('السلف', '', 'adv-table')}<div class="table-wrap"><table id="adv-table" class="records-table"><thead><tr><th>التاريخ</th><th>الصندوق</th><th>النوع</th><th>الشخص/الجهة</th><th>المبلغ</th><th>ملاحظة</th><th>إجراء</th></tr></thead><tbody>${trs||'<tr><td colspan="7" class="empty-state">لا يوجد سلف</td></tr>'}</tbody></table></div>`;
    }

    function viewLedger() {
        const txs = [...state.tx].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0, 300);
        const trs = txs.map(t=>`<tr><td data-label="ID"><small style="color:var(--text-muted)">${escapeHtml(String(t.id||'').split('-')[1]||'')}</small></td><td data-label="التاريخ">${escapeHtml(t.date)}</td><td data-label="النوع">${typeBadge(txTypeLabel(t))}</td><td data-label="المصدر">${sourceCell(t)}</td><td data-label="الوجهة">${destinationCell(t)}</td><td data-label="المبلغ" class="ltr-num">${ledgerAmountText(t)}</td><td data-label="ملاحظة" class="note-cell">${escapeHtml(txNoteWithCut(t))}</td><td data-label="إجراء" class="actions-cell"><button class="btn-action" onclick="ui.edit('${t.id}')">تعديل</button><button class="btn-action del" onclick="ui.del('${t.id}')">حذف</button></td></tr>`).join('');
        return `${toolbar('الدفتر الأستاذ', 'ui.export()', 'ledger-tbl')}<div class="table-wrap"><table id="ledger-tbl" class="records-table"><thead><tr><th>ID</th><th>التاريخ</th><th>النوع</th><th>المصدر</th><th>الوجهة</th><th>المبلغ</th><th>ملاحظة</th><th>إجراء</th></tr></thead><tbody>${trs||'<tr><td colspan="8" class="empty-state">لا يوجد بيانات</td></tr>'}</tbody></table></div>`;
    }

    function viewRecycle() {
        const trs = state.delTx.map(t=>`<tr><td data-label="التاريخ">${escapeHtml(t.date)}</td><td data-label="النوع">${typeBadge(txTypeLabel(t))}</td><td data-label="المبلغ" class="ltr-num">${ledgerAmountText(t)}</td><td data-label="إجراء" class="actions-cell"><button class="btn-action text-success" onclick="ui.res('${t.id}')">استرجاع</button><button class="btn-action del" onclick="ui.hardDel('${t.id}')">نهائي</button></td></tr>`).join('');
        return `${toolbar('سلة المحذوفات', '', 'recycle-table')}<div class="table-wrap"><table id="recycle-table" class="records-table"><thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>إجراء</th></tr></thead><tbody>${trs||'<tr><td colspan="4" class="empty-state">السلة فارغة</td></tr>'}</tbody></table></div>`;
    }
    
    function viewSettings() { 
        const isLight = document.body.classList.contains('theme-light');
        const soundOn = localStorage.getItem('imad_sound_enabled') === '1';
        const cloudEmail = currentUser?.email || '';
        const cloudState = currentUser ? `متصل: ${escapeHtml(cloudEmail)}` : 'غير مسجل دخول — الحفظ محلي فقط';
        return `<h2>الإعدادات</h2><div class="grid-cards">
            <div class="card"><h3>المظهر</h3><p class="card-title">تبديل Dark / Light بانتقال سلس.</p><button class="btn-submit" style="margin-top:auto" onclick="premium.toggleTheme()">${isLight ? 'تفعيل المظهر الداكن' : 'تفعيل المظهر الفاتح'}</button></div>
            <div class="card"><h3>صوت الحفظ</h3><p class="card-title">صوت ناعم اختياري عند الحفظ الناجح.</p><button class="btn-submit" style="margin-top:auto" onclick="premium.toggleSound()">${soundOn ? 'إيقاف الصوت' : 'تفعيل الصوت'}</button></div>
            <div class="card"><h3>حماية السحابة</h3><p class="card-title">${cloudState}</p>${currentUser ? `<button class="btn-submit" style="margin-top:auto; background:var(--danger)" onclick="ui.logoutCloud()">تسجيل الخروج</button>` : `<input id="cloud-email" type="email" placeholder="Firebase email" autocomplete="username" style="margin-bottom:.75rem"><input id="cloud-password" type="password" placeholder="Firebase password" autocomplete="current-password" style="margin-bottom:.75rem"><button class="btn-submit" style="margin-top:auto" onclick="ui.loginCloud()">تسجيل الدخول للسحابة</button>`}</div>
            <div class="card"><h3>نسخ احتياطي</h3><button class="btn-submit" style="margin-top:auto" onclick="ui.backup()">تحميل النسخة</button></div>
            <div class="card"><h3>تصدير PDF</h3><p class="card-title">تصدير الصفحة الحالية كما تظهر الآن.</p><button class="btn-submit" style="margin-top:auto" onclick="ui.exportPdf()">تحميل PDF</button></div>
            <div class="card"><h3>استعادة ودمج</h3><input type="file" id="f-res" style="margin-bottom:1rem; padding:0.5rem"><button class="btn-submit" style="margin-top:auto; background:var(--success)" onclick="ui.restore()">دمج البيانات</button></div>
            <div class="card" style="border-color:var(--danger)"><h3 class="text-danger">مسح النظام</h3><button class="btn-submit" style="margin-top:auto; background:var(--danger)" onclick="ui.wipe()">Wipe Data</button></div>
        </div>`; 
    }

    // --- 6. EVENT ATTACHMENTS & LOGIC ---
    function attachDynamicListeners() {
        if(document.getElementById('frm-rev')) {
            const reg=document.getElementById('rev-reg'), del=document.getElementById('rev-del'), bal=document.getElementById('rev-bal');
            reg.onchange=e=>{ 
                const arr = CONSTANTS.DELEGATES[e.target.value] || [];
                del.innerHTML= arr.length ? ui.opts(arr) : '<option value="">اختر المنطقة أولاً</option>'; 
                bal.classList.add('hidden'); 
            };
            del.onchange=e=>{ if(e.target.value){ const b=calc.delegate(e.target.value).b; bal.innerHTML=`المتبقي: <span class="ltr-num ${calc.color(b)}">${calc.num(b)}</span>`; bal.classList.remove('hidden'); }};
            document.getElementById('frm-rev').onsubmit=e=>ui.submit(e, d=>{ d.id=genId(); d.type='REVENUE'; d.syp=parseMoney(d.syp); d.updatedAt=Date.now(); const tx = validateTx(normalizeTx(d)); state.tx.push(tx); });
        }
        if(document.getElementById('frm-ho')) {
            const tType=document.getElementById('ho-totype'), tId=document.getElementById('ho-toid'), cSyp=document.getElementById('ho-cutsyp'), rate=document.getElementById('ho-rate'), res=document.getElementById('ho-res'), hoDelegate=document.getElementById('ho-delegate'), hoInfo=document.getElementById('ho-delegate-info');
            tType.onchange=e=>tId.innerHTML=ui.opts(e.target.value==='office'?CONSTANTS.OFFICES:CONSTANTS.SAFES);
            hoDelegate.onchange=e=>{
                const name = e.target.value;
                if(!name) { hoInfo.classList.add('hidden'); hoInfo.innerHTML=''; return; }
                const b = calc.delegate(name);
                const delivered = (Number(b.ho) || 0) + (Number(b.cut) || 0);
                hoInfo.innerHTML = `<div class="detail-box" style="margin:0"><small>إجمالي إيراد ${escapeHtml(name)}</small><strong class="ltr-num text-primary">${calc.num(b.rev)} SYP</strong></div><div class="detail-box" style="margin:0"><small>إجمالي المسلّم</small><strong class="ltr-num text-success">${calc.num(delivered)} SYP</strong></div><div class="detail-box" style="margin:0"><small>إجمالي المتبقي عنده</small><strong class="ltr-num ${calc.color(b.b)}">${calc.num(b.b)} SYP</strong></div>`;
                hoInfo.classList.remove('hidden');
            };
            const calcCut=()=>{ const r=parseMoney(rate.value), s=parseMoney(cSyp.value); res.innerHTML=calc.num(r>0?s/r:0, true) + ' <span style="font-size:1rem;color:var(--text-muted)">USD</span>';}; cSyp.oninput=calcCut; rate.oninput=calcCut;
            document.getElementById('frm-ho').onsubmit=e=>ui.submit(e, d=>{ d.syp=parseMoney(d.syp); d.usd=parseMoney(d.usd); d.cutSyp=parseMoney(d.cutSyp); d.rate=parseMoney(d.rate); d.id=genId(); d.type='HANDOVER'; d.updatedAt=Date.now(); const tx = validateTx(normalizeTx(d)); state.tx.push(tx); });
        }
        if(document.getElementById('frm-off')) {
            const typ=document.getElementById('off-type'), f=document.getElementById('off-f'), t=document.getElementById('off-t'), p=document.getElementById('off-p'), c=document.getElementById('off-c'), r=document.getElementById('off-r'), commSyp=document.getElementById('off-comm-syp'), commUsd=document.getElementById('off-comm-usd');
            typ.onchange=e=>{
                const v=e.target.value; [f,t,p,c,r,commSyp,commUsd].forEach(x=>x.classList.add('hidden')); f.classList.remove('hidden'); f.querySelector('label').innerText='من مكتب'; f.querySelector('select').innerHTML=ui.opts(CONSTANTS.OFFICES); t.querySelector('label').innerText='إلى';
                if(v==='office_transfer'){ t.classList.remove('hidden'); c.classList.remove('hidden'); commSyp.classList.remove('hidden'); commUsd.classList.remove('hidden'); t.querySelector('select').innerHTML=ui.opts(CONSTANTS.OFFICES); }
                if(v==='office_convert_syp_to_usd'){ r.classList.remove('hidden'); }
                if(v==='office_external'||v==='office_person'){ p.classList.remove('hidden'); c.classList.remove('hidden'); commSyp.classList.remove('hidden'); commUsd.classList.remove('hidden'); }
                if(v==='office_adjust_add'||v==='office_adjust_sub'){ c.classList.remove('hidden'); }
            }; typ.dispatchEvent(new Event('change'));
            document.getElementById('frm-off').onsubmit=e=>ui.submit(e, d=>{
                d.id=genId(); d.amt=parseMoney(d.amt); d.rate=parseMoney(d.rate); d.commissionSyp=parseMoney(d.commissionSyp); d.commissionUsd=parseMoney(d.commissionUsd);
                if(d.commissionSyp < 0 || d.commissionUsd < 0) throw new Error('العمولة لا يمكن أن تكون سالبة');
                if(d.type==='office_convert_syp_to_usd') { d.toId=''; d.person=''; d.cur='SYP'; }
                if(d.type==='office_external'||d.type==='office_person') { d.toId=''; }
                if(d.type==='office_adjust_add'||d.type==='office_adjust_sub') { d.toId=''; d.person=''; }
                d.updatedAt=Date.now(); const tx = validateTx(normalizeTx(d)); state.tx.push(tx);
            });
        }
        if(document.getElementById('frm-safe')) {
            const typ=document.getElementById('sf-type'), s=document.getElementById('sf-s'), f=document.getElementById('sf-f'), t=document.getElementById('sf-t'), p=document.getElementById('sf-p'), c=document.getElementById('sf-c'), r=document.getElementById('sf-r'), commSyp=document.getElementById('sf-comm-syp'), commUsd=document.getElementById('sf-comm-usd');
            typ.onchange=e=>{
                const v=e.target.value; [s,f,t,p,c,r,commSyp,commUsd].forEach(x=>x.classList.add('hidden')); s.classList.remove('hidden');
                if(v.includes('PERSON')||v.includes('GENERAL')||v.includes('ADVANCE')) p.classList.remove('hidden');
                if(editableCurrencyTypes.includes(v)) c.classList.remove('hidden');
                if(v.includes('EXCHANGE')) r.classList.remove('hidden');
                if(v==='SAFE_TO_SAFE'){ s.classList.add('hidden'); f.classList.remove('hidden'); t.classList.remove('hidden'); c.classList.remove('hidden'); f.querySelector('select').innerHTML=ui.opts(CONSTANTS.SAFES); t.querySelector('select').innerHTML=ui.opts(CONSTANTS.SAFES); }
                if(v==='SAFE_TO_OFFICE'){ s.classList.add('hidden'); f.classList.remove('hidden'); t.classList.remove('hidden'); c.classList.remove('hidden'); f.querySelector('select').innerHTML=ui.opts(CONSTANTS.SAFES); t.querySelector('select').innerHTML=ui.opts(CONSTANTS.OFFICES); }
                if(v==='OFFICE_TO_SAFE'){ s.classList.add('hidden'); f.classList.remove('hidden'); t.classList.remove('hidden'); c.classList.remove('hidden'); commSyp.classList.remove('hidden'); commUsd.classList.remove('hidden'); f.querySelector('select').innerHTML=ui.opts(CONSTANTS.OFFICES); t.querySelector('select').innerHTML=ui.opts(CONSTANTS.SAFES); }
            }; typ.dispatchEvent(new Event('change'));
            document.getElementById('frm-safe').onsubmit=e=>ui.submit(e, d=>{
                d.id=genId(); d.amt=parseMoney(d.amt); d.rate=parseMoney(d.rate); d.cur=cleanCurrency(d.cur); d.commissionSyp=parseMoney(d.commissionSyp); d.commissionUsd=parseMoney(d.commissionUsd);
                if(d.commissionSyp < 0 || d.commissionUsd < 0) throw new Error('العمولة لا يمكن أن تكون سالبة');
                if(!editableCurrencyTypes.includes(d.type)) d.cur = (d.type.includes('_USD') || d.type==='SAFE_EXCHANGE_USD_TO_SYP') ? 'USD' : 'SYP';
                d.updatedAt=Date.now(); const tx = validateTx(normalizeTx(d)); state.tx.push(tx);
            });
        }
        enhanceRecordTables();
        bindTableFilters();
        attachMoneyInputs();
        premium.bindContextMenu();
        premium.attachShortcuts();
    }

    // --- INIT ---
    window.onload = async () => {
        document.getElementById('edit-modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal-overlay') ui.closeModal();
        });
        document.getElementById('nav-menu').innerHTML = NAV.map(n=>`<button class="nav-btn ${state.view===n.id?'active':''}" data-id="${n.id}" onclick="nav('${n.id}')"><span class="nav-icon">${n.icon}</span><span>${n.title}</span></button>`).join('');
        premium.init();
        premium.renderSkeleton();
        await initFirebase();
        const result = await loadData();
        renderView();
        if (result && !result.cloud) ui.toast(`تم تحميل البيانات المحلية فقط — ${result.error || 'تعذر الاتصال بالسحابة'}`, 'error');
    };
</script>
</body>
</html>
